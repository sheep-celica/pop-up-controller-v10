; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = pop-up-controller-v10-rev-c

[env]
platform = espressif32
board = esp32doit-devkit-v1
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++14
framework = arduino
extra_scripts = pre:scripts/pio_build_info.py
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
lib_deps = 
	jeremycole/I2C Temperature Sensors derived from the LM75@^1.0.3
	robtillaart/PCF8574@^0.4.4

[env:pop-up-controller-v10-rev-c]
build_flags =
  ${env.build_flags}
  -D POPUP_CONTROLLER_BOARD_REV_C

[env:pop-up-controller-v10-rev-e]
build_flags =
  ${env.build_flags}
  -D POPUP_CONTROLLER_BOARD_REV_E

[env:pop-up-controller-v10-rev-e-esp32-s3]
board = esp32-s3-devkitc-1
build_flags =
  ${env.build_flags}
  -D POPUP_CONTROLLER_BOARD_REV_E_ESP32_S3
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.extra_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=0
monitor_dtr = 1
monitor_rts = 1
